# CougarCalc.com site — Cloudflare Worker + static assets (MemoryMap pattern).
# Custom domains stay commented until DNS go-ahead.
# Staging: `npm run deploy` → workers.dev only. Production: `npm run deploy:production`.

name = "cougarcalc"
account_id = "d7cbc700dc3f0f8894ffdbbbb0934f4a"
main = "./worker.ts"
compatibility_date = "2026-09-09"
workers_dev = true

# [[routes]]
# pattern = "cougarcalc.com"
# custom_domain = true
#
# [[routes]]
# pattern = "www.cougarcalc.com"
# custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[observability]
enabled = true

# Bookmarkable preview. No custom domain.
[env.staging]
name = "cougarcalc-staging"
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
